<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой магазин</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header"> 
		<div class="logo">MyShop</div>
		<nav>
			<a href="#products">Товары</a>
			<a href="#cart">Корзина</a>
			<a href="#contacts">Контакты</a>
		</nav>
		<div class="header-cart">
			<span>Корзина: <strong id="header-cart-count">0</strong></span>
			<button id="clear-cart-btn" type="button">Очистить корзину</button>
		</div>
    </header>

    <main>
		<section id="hero">
	    	<h2>Добро пожаловать в магазин</h2>
            <p>Здесь будут наши лучшие товары.</p>
		</section>
	
		<section id="products">
	    	<h2>Товары</h2>
	    	<div class="products-gird"></div>
		</section>

		<section id="cart">
      		<h2>Корзина</h2>
        	<p>Товаров в корзине: <span id="cart-count">0</span></p>
			<p>Общая стоимость: <span id="cart-total">0</span> ₽</p>
			<ul id="cart-items">
			</ul>
    	</section>
	</main>

    <footer id="contacts">
    	<p>Контакты магазина</p>
    </footer>
	<script defer src="js/script.js"></script>
</body>
